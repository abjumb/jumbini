name: Release

# Push a tag, get a signed and notarized DMG attached to a GitHub release.
#
#   git tag v4.1 && git push origin v4.1
#
# Requires seven repository secrets — see SIGNING.md for how to create each:
#   MACOS_CERT_P12_BASE64    Developer ID Application cert + key, .p12, base64
#   MACOS_CERT_PASSWORD      the password you set when exporting that .p12
#   SIGN_IDENTITY            "Developer ID Application: Your Name (TEAMID)"
#   APPLE_API_KEY_P8_BASE64  App Store Connect .p8 private key, base64
#   APPLE_API_KEY_ID         the key ID
#   APPLE_API_ISSUER_ID      the issuer UUID
#   SPARKLE_ED25519_KEY      base64 EdDSA seed from .sparkle-ed25519-key
#
# GitHub Pages must be enabled (Settings → Pages → Source: "Deploy from a
# branch", branch gh-pages) — that is where the appcast and the DMGs live, and
# what SUFeedURL in Scripts/Info.plist points at.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload the DMG

env:
  # How many DMGs gh-pages keeps. The branch is what Sparkle downloads from,
  # not an archive — every release attaches its own DMG to the GitHub Release,
  # which is where an old build should be fetched from. Raising this only buys
  # cheaper updates for users further behind (generate_appcast can diff against
  # more old builds); it does not make any release more reachable.
  KEEP_RELEASES: 2

jobs:
  release:
    # An Apple Silicon runner, because Jumbini is Apple Silicon only.
    #
    # This image must carry an SDK at least as new as the newest API the source
    # uses, and it must not fall behind ci.yml. It did once: ci.yml tracks
    # macos-latest, which had moved to Xcode 26 while this was still pinned to
    # macos-15 and Xcode 16.4. A pull request using NSGlassEffectView (macOS
    # 26) therefore went green on CI and then failed to compile here, on the
    # tag, after the merge — CI cannot vouch for a build it never makes.
    #
    # Pinned rather than macos-latest so an image roll cannot land first in a
    # release, but the pin is a floor to raise, not a version to hold.
    runs-on: macos-26
    # notarytool can wait a long time on a bad day; don't let a stall burn the
    # 360-minute default (billed 10x on macOS runners).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "arch: $(uname -m)"
          echo "active developer dir: $(xcode-select -p)"

      # Deliberately NOT ./Scripts/test.sh. That script hardcodes plugin and
      # rpath flags into /Library/Developer/CommandLineTools, which is correct
      # for a local Xcode-free setup but wrong here: the runner's active
      # toolchain is Xcode, and when GitHub bumps Xcode and CLT independently
      # those paths break the release on an error unrelated to releasing.
      - name: Run tests
        run: swift test

      # The tag is the source of truth for the version. Without this the
      # workflow happily ships a release labelled v4.1 containing an app that
      # reports itself as whatever is hardcoded in Info.plist.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" Scripts/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Scripts/Info.plist
          echo "Stamped CFBundleShortVersionString=$V CFBundleVersion=$GITHUB_RUN_NUMBER"

      # ---------------------------------------------------------------------
      # Import the signing certificate into a throwaway keychain.
      #
      # A dedicated keychain (rather than the login one) keeps the private key
      # out of anything else on the runner and lets us delete it wholesale at
      # the end. The runner is ephemeral anyway; this is belt and braces.
      # ---------------------------------------------------------------------
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          # Random per-run password; never leaves the runner.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          # Strip whitespace before decoding. `base64 -i cert.p12` on macOS
          # hard-wraps at 68 columns, and a paste into the GitHub secrets UI can
          # pick up CRs or stray blank lines on the way. None of that is a real
          # corruption, so normalise it rather than failing on it.
          #
          # What is NOT recoverable is a genuinely non-base64 character, which
          # is what "error decoding base64 input stream" means. Bare, that
          # message says nothing about which of the secrets is wrong or why,
          # so check the alphabet ourselves and say so.
          CLEAN="$(printf '%s' "$MACOS_CERT_P12_BASE64" | tr -d '[:space:]')"

          if [ -z "$CLEAN" ]; then
            echo "::error::MACOS_CERT_P12_BASE64 is empty. Set it to the base64" \
                 "of your exported .p12: base64 -i cert.p12 | pbcopy"
            exit 1
          fi

          if printf '%s' "$CLEAN" | LC_ALL=C grep -q '[^A-Za-z0-9+/=]'; then
            echo "::error::MACOS_CERT_P12_BASE64 contains characters that are not" \
                 "valid base64. This usually means the secret holds a file path," \
                 "or the value was mangled in transit (smart quotes, an ellipsis" \
                 "from truncated terminal output). Re-copy it with:" \
                 "base64 -i cert.p12 | pbcopy"
            exit 1
          fi

          if ! printf '%s' "$CLEAN" | base64 --decode > "$CERT_PATH"; then
            echo "::error::MACOS_CERT_P12_BASE64 failed to base64-decode even" \
                 "though every character is in the base64 alphabet — the value is" \
                 "most likely truncated. Re-copy the whole blob."
            exit 1
          fi

          # A .p12 is a DER SEQUENCE, so it always starts with 0x30. Catching a
          # wrong-file paste here beats letting `security import` fail later
          # with a generic error, or — worse — succeed on something unexpected.
          if [ "$(head -c 1 "$CERT_PATH" | xxd -p)" != "30" ]; then
            echo "::error::The decoded MACOS_CERT_P12_BASE64 is not a PKCS#12 file." \
                 "Check you exported a 'Developer ID Application' certificate" \
                 "(with its private key) as .p12 — not a .cer or .pem."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # -P puts the password on argv, so it is briefly visible in `ps`.
          # Accepted: the runner is ephemeral and single-tenant.
          security import "$CERT_PATH" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          # Without this, codesign triggers an interactive keychain prompt that
          # nothing can answer on a headless runner, and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Put it first in the search list so codesign finds the identity,
          # keeping the runner's existing keychains after it. Read the old list
          # into an array first — doing it inline as an unquoted $(...) means a
          # failure of the inner command silently collapses the search list to
          # just this one keychain for the rest of the job.
          OLD_KEYCHAINS=()
          while IFS= read -r k; do
            k="${k//\"/}"; k="${k#"${k%%[![:space:]]*}"}"; k="${k%"${k##*[![:space:]]}"}"
            [ -n "$k" ] && OLD_KEYCHAINS+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${OLD_KEYCHAINS[@]}"

          rm -f "$CERT_PATH"

          echo "Identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # Same whitespace-tolerant, diagnosable decode as the .p12 step above.
          CLEAN="$(printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d '[:space:]')"

          if [ -z "$CLEAN" ]; then
            echo "::error::APPLE_API_KEY_P8_BASE64 is empty. Set it with:" \
                 "base64 -i AuthKey_XXXXXXXXXX.p8 | pbcopy"
            exit 1
          fi

          if printf '%s' "$CLEAN" | LC_ALL=C grep -q '[^A-Za-z0-9+/=]'; then
            echo "::error::APPLE_API_KEY_P8_BASE64 contains characters that are not" \
                 "valid base64. Re-copy it with: base64 -i AuthKey_XXXXXXXXXX.p8 | pbcopy"
            exit 1
          fi

          if ! printf '%s' "$CLEAN" | base64 --decode > "$RUNNER_TEMP/apikey.p8"; then
            echo "::error::APPLE_API_KEY_P8_BASE64 failed to base64-decode; the" \
                 "value is most likely truncated. Re-copy the whole blob."
            exit 1
          fi

          # The .p8 is PEM, so notarytool needs the header intact. A base64 blob
          # of the wrong file decodes fine and only explodes much later, inside
          # notarization, after a full build has already been paid for.
          if ! head -n 1 "$RUNNER_TEMP/apikey.p8" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::The decoded APPLE_API_KEY_P8_BASE64 is not a PEM private" \
                 "key. Check you base64'd the App Store Connect .p8 file itself."
            exit 1
          fi

          chmod 600 "$RUNNER_TEMP/apikey.p8"

      - name: Build, sign, notarize and staple
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/apikey.p8"
          ./Scripts/release.sh

      # Keep the DMG regardless of how the run was started, and before anything
      # downstream can fail. A notarized build costs a round-trip to Apple, and
      # until now a manual run threw one away while a tagged run that stumbled on
      # the appcast or the Pages deploy made you do the whole thing again to get
      # the file back. Uploading here means the expensive artifact survives every
      # later step.
      #
      # On a tag the same DMG also lands on the release, so this copy is a
      # convenience rather than the record — hence the short retention. On a
      # manual run it is the only output there is.
      - name: Upload the DMG as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jumbini-${{ github.ref_name }}-${{ github.run_number }}
          path: build/Jumbini.dmg
          if-no-files-found: error
          retention-days: 14

      # Turn the DMG into a Sparkle update. Only meaningful for a tagged release
      # (a manual workflow_dispatch has no tag to version the update with), which
      # mirrors the gating on the version-stamp step above.
      #
      # The appcast is generated against the *whole* gh-pages history — previous
      # DMGs plus the existing appcast.xml — so deltas are emitted against the
      # last release and old entries are pruned rather than orphaned. On the
      # first release there is no gh-pages yet; generate_appcast starts fresh.
      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SPARKLE_ED25519_KEY" ]; then
            echo "::error::SPARKLE_ED25519_KEY secret is not set. Add the base64" \
                 "EdDSA seed from .sparkle-ed25519-key as a repository secret" \
                 "(Settings → Secrets and variables → Actions)."
            exit 1
          fi

          V="${GITHUB_REF_NAME#v}"
          PAGES="build/pages"
          rm -rf "$PAGES"
          mkdir -p "$PAGES"

          # Bring in whatever gh-pages already holds (previous DMGs, appcast.xml,
          # delta files, old_updates/) so the feed stays contiguous.
          if git fetch origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
            git archive refs/remotes/origin/gh-pages | tar -x -C "$PAGES"
          fi

          cp build/Jumbini.dmg "$PAGES/Jumbini-$V.dmg"

          # gh-pages is append-only unless something prunes it: every release
          # adds ~2 MB of DMG and a handful of deltas, and nothing ever removed
          # the old ones. Keep the newest $KEEP_RELEASES DMGs and let
          # generate_appcast rebuild the feed around whatever survives, so the
          # appcast can never advertise a DMG that is no longer here.
          #
          # Deleting an old DMG does not strand anyone. Sparkle offers the
          # newest item, and the deltas that let an old build patch up to it are
          # keyed off the *installed* app, not off a hosted copy of it. The one
          # real cost is that generate_appcast can only diff against the DMGs
          # still present, so a user more than $KEEP_RELEASES releases behind
          # downloads the full ~2 MB instead of a ~150 KB delta.
          #
          # Nothing is lost either way: every release attaches its DMG to the
          # GitHub Release (see "Attach DMG to the release" below), which is
          # where an old build should be fetched from anyway.
          ls "$PAGES"/Jumbini-*.dmg 2>/dev/null \
            | sed 's|.*/Jumbini-\(.*\)\.dmg|\1|' \
            | sort -V \
            | head -n -"$KEEP_RELEASES" \
            | while read -r old; do
                echo "  pruning Jumbini-$old.dmg (keeping the newest $KEEP_RELEASES)"
                rm -f "$PAGES/Jumbini-$old.dmg"
              done

          SPARKLE_ED25519_KEY="$SPARKLE_ED25519_KEY" ./Scripts/appcast.sh "$PAGES"

          # generate_appcast has just rewritten appcast.xml from the DMGs that
          # remain, so anything it does not name is dead weight — the deltas
          # belonging to a pruned version, and any archive orphaned by an
          # earlier run. Two such DMGs and an old_updates/ delta had been
          # sitting unreferenced on gh-pages for exactly that reason.
          #
          # Driven off the regenerated appcast rather than off a list of what
          # was deleted, so it also sweeps up orphans this step never made.
          python3 - "$PAGES" <<'PRUNE'
          import os, re, sys

          pages = sys.argv[1]
          with open(os.path.join(pages, "appcast.xml"), encoding="utf-8") as fh:
              referenced = {u.rsplit("/", 1)[-1]
                            for u in re.findall(r'url="([^"]+)"', fh.read())}

          for root, _, names in os.walk(pages):
              for name in names:
                  if not name.endswith((".dmg", ".delta")) or name in referenced:
                      continue
                  path = os.path.join(root, name)
                  print("  removing unreferenced %s (%.2f MB)"
                        % (os.path.relpath(path, pages),
                           os.path.getsize(path) / 1048576))
                  os.remove(path)

          # An empty old_updates/ left behind by the sweep is just noise.
          for root, dirs, _ in os.walk(pages, topdown=False):
              for d in dirs:
                  try:
                      os.rmdir(os.path.join(root, d))
                  except OSError:
                      pass
          PRUNE

          echo "Pages payload after retention:"
          du -ch "$PAGES"/*.dmg "$PAGES"/*.delta 2>/dev/null | tail -1

      # The download page ships in the same payload as the appcast, because it
      # has to be served from the same place. SUFeedURL is compiled into every
      # copy of the app that has ever shipped, so the site cannot take over
      # abjumb.github.io/jumbini from a different branch or folder without
      # stranding everyone already running Jumbini. Same payload, same origin,
      # no conflict — and the page is refreshed on every release.
      - name: Add the download page to the Pages payload
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          PAGES="build/pages"

          [ -d "$PAGES" ] || { echo "::error::$PAGES is missing; the appcast step must run first."; exit 1; }
          [ -f docs/index.html ] || { echo "::error::docs/index.html is missing."; exit 1; }

          # docs/ wins on collisions, so the committed site is what ships, but
          # everything already on gh-pages that docs/ does not name — the DMGs,
          # appcast.xml, the delta files — is left exactly where it was.
          cp -R docs/. "$PAGES/"

          # The page states which version it hands out. Stamp it from the tag
          # for the same reason Info.plist is stamped: so it cannot drift from
          # what actually shipped. (v4.2 went out with the page still saying v4.0.)
          sed -i '' "s/data-version=\"[^\"]*\"/data-version=\"v$V\"/" "$PAGES/index.html"
          if ! grep -q "data-version=\"v$V\"" "$PAGES/index.html"; then
            echo "::error::Could not stamp v$V into docs/index.html — the" \
                 "data-version attribute on <body> is gone or was renamed."
            exit 1
          fi

          echo "Download page stamped v$V. Pages payload:"
          ls -1 "$PAGES" | sed 's/^/  /'

      - name: Deploy appcast to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/pages
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "Publish appcast for ${{ github.ref_name }}"

      # A broken update feed is invisible from inside the build: the appcast is
      # generated, signed and published exactly as instructed, and only fails on
      # a user's machine, where Sparkle announces an update and then cannot
      # fetch it. v4.2 shipped that way — the download prefix was missing its
      # trailing slash, so every enclosure URL dropped the /jumbini/ path
      # segment and 404'd. So fetch what was actually published and prove the
      # DMG behind it is downloadable before calling the release good.
      - name: Verify the published feed and download page
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail

          FEED_URL="$(/usr/libexec/PlistBuddy -c 'Print :SUFeedURL' Scripts/Info.plist)"
          V="${GITHUB_REF_NAME#v}"
          EXPECTED_DMG="${FEED_URL%/*}/Jumbini-$V.dmg"

          echo "Feed:     $FEED_URL"
          echo "Expected: $EXPECTED_DMG"

          # GitHub Pages rebuilds asynchronously after the branch push, so the
          # new appcast is not readable the instant the deploy step returns.
          FEED=""
          for attempt in $(seq 1 24); do
            if FEED="$(curl -fsSL --max-time 20 "$FEED_URL" 2>/dev/null)"; then
              if printf '%s' "$FEED" | grep -qF "Jumbini-$V.dmg"; then
                echo "Feed is live and lists $V (attempt $attempt)."
                break
              fi
              echo "Feed is live but does not list $V yet (attempt $attempt)..."
            else
              echo "Feed not reachable yet (attempt $attempt)..."
            fi
            FEED=""
            sleep 10
          done

          if [ -z "$FEED" ]; then
            echo "::error::$FEED_URL did not serve an appcast listing $V within four" \
                 "minutes. Check that GitHub Pages is still set to deploy from the" \
                 "gh-pages branch (Settings → Pages). SUFeedURL in Scripts/Info.plist" \
                 "is baked into every shipped copy of the app, so moving Pages away" \
                 "from that path breaks auto-update for everyone already running it."
            exit 1
          fi

          if ! printf '%s' "$FEED" | grep -qF "url=\"$EXPECTED_DMG\""; then
            echo "::error::The published appcast does not point at $EXPECTED_DMG." \
                 "Enclosure URLs found:"
            printf '%s' "$FEED" | grep -oE 'url="[^"]+"' | sed 's/^/  /'
            exit 1
          fi

          CODE="$(curl -o /dev/null -sSL -w '%{http_code}' --max-time 60 "$EXPECTED_DMG" || echo 000)"
          if [ "$CODE" != "200" ]; then
            echo "::error::$EXPECTED_DMG returned HTTP $CODE. Sparkle would offer" \
                 "this update and then fail to download it."
            exit 1
          fi

          echo "Update feed verified: $V is announced and its DMG downloads (HTTP 200)."

          # The page went out in the same payload, so if the feed is live and the
          # page is not, the copy step is what broke.
          SITE_URL="${FEED_URL%/*}/"
          PAGE="$(curl -fsSL --max-time 20 "$SITE_URL" || true)"
          if [ -z "$PAGE" ]; then
            echo "::error::$SITE_URL served no download page, but the appcast next" \
                 "to it is live. Check the 'Add the download page' step."
            exit 1
          fi
          if ! printf '%s' "$PAGE" | grep -q "data-version=\"v$V\""; then
            echo "::error::$SITE_URL is live but does not advertise v$V."
            exit 1
          fi
          echo "Download page verified: $SITE_URL is live and advertises v$V."

      # Always runs, including after a failed build, so the key never survives
      # the job even if something above blew up.
      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apikey.p8" "$RUNNER_TEMP/cert.p12"
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

      # Tag-gated like every other step that needs a tag to exist. It is the one
      # that was missed, and the failure was confusing: the action takes its
      # tag_name from github.ref, which on a workflow_dispatch is refs/heads/main
      # rather than a tag, so it asked the API to create a release for no tag at
      # all and got back "Missing tag_name parameter" three times before giving
      # up. Every earlier step had already succeeded, so a manual run built,
      # signed and notarized cleanly and then reported failure at the very end.
      - name: Attach DMG to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Jumbini.dmg
          draft: true          # review it before it goes public
          generate_release_notes: true
