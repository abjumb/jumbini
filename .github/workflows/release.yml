name: Release

# Push a tag, get a signed and notarized DMG attached to a GitHub release.
#
#   git tag v4.1 && git push origin v4.1
#
# Requires seven repository secrets — see SIGNING.md for how to create each:
#   MACOS_CERT_P12_BASE64    Developer ID Application cert + key, .p12, base64
#   MACOS_CERT_PASSWORD      the password you set when exporting that .p12
#   SIGN_IDENTITY            "Developer ID Application: Your Name (TEAMID)"
#   APPLE_API_KEY_P8_BASE64  App Store Connect .p8 private key, base64
#   APPLE_API_KEY_ID         the key ID
#   APPLE_API_ISSUER_ID      the issuer UUID
#   SPARKLE_ED25519_KEY      base64 EdDSA seed from .sparkle-ed25519-key
#
# GitHub Pages must be enabled (Settings → Pages → Source: "Deploy from a
# branch", branch gh-pages) — that is where the appcast and the DMGs live, and
# what SUFeedURL in Scripts/Info.plist points at.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create the release and upload the DMG

jobs:
  release:
    # An Apple Silicon runner, because Jumbini is Apple Silicon only.
    # macos-latest moved to macos-26 in 2026, so this pin will eventually enter
    # deprecation — revisit it when GitHub announces macos-15 retirement.
    runs-on: macos-15
    # notarytool can wait a long time on a bad day; don't let a stall burn the
    # 360-minute default (billed 10x on macOS runners).
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "arch: $(uname -m)"
          echo "active developer dir: $(xcode-select -p)"

      # Deliberately NOT ./Scripts/test.sh. That script hardcodes plugin and
      # rpath flags into /Library/Developer/CommandLineTools, which is correct
      # for a local Xcode-free setup but wrong here: the runner's active
      # toolchain is Xcode, and when GitHub bumps Xcode and CLT independently
      # those paths break the release on an error unrelated to releasing.
      - name: Run tests
        run: swift test

      # The tag is the source of truth for the version. Without this the
      # workflow happily ships a release labelled v4.1 containing an app that
      # reports itself as whatever is hardcoded in Info.plist.
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          V="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" Scripts/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" Scripts/Info.plist
          echo "Stamped CFBundleShortVersionString=$V CFBundleVersion=$GITHUB_RUN_NUMBER"

      # ---------------------------------------------------------------------
      # Import the signing certificate into a throwaway keychain.
      #
      # A dedicated keychain (rather than the login one) keeps the private key
      # out of anything else on the runner and lets us delete it wholesale at
      # the end. The runner is ephemeral anyway; this is belt and braces.
      # ---------------------------------------------------------------------
      - name: Import Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          # Random per-run password; never leaves the runner.
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          # Strip whitespace before decoding. `base64 -i cert.p12` on macOS
          # hard-wraps at 68 columns, and a paste into the GitHub secrets UI can
          # pick up CRs or stray blank lines on the way. None of that is a real
          # corruption, so normalise it rather than failing on it.
          #
          # What is NOT recoverable is a genuinely non-base64 character, which
          # is what "error decoding base64 input stream" means. Bare, that
          # message says nothing about which of the secrets is wrong or why,
          # so check the alphabet ourselves and say so.
          CLEAN="$(printf '%s' "$MACOS_CERT_P12_BASE64" | tr -d '[:space:]')"

          if [ -z "$CLEAN" ]; then
            echo "::error::MACOS_CERT_P12_BASE64 is empty. Set it to the base64" \
                 "of your exported .p12: base64 -i cert.p12 | pbcopy"
            exit 1
          fi

          if printf '%s' "$CLEAN" | LC_ALL=C grep -q '[^A-Za-z0-9+/=]'; then
            echo "::error::MACOS_CERT_P12_BASE64 contains characters that are not" \
                 "valid base64. This usually means the secret holds a file path," \
                 "or the value was mangled in transit (smart quotes, an ellipsis" \
                 "from truncated terminal output). Re-copy it with:" \
                 "base64 -i cert.p12 | pbcopy"
            exit 1
          fi

          if ! printf '%s' "$CLEAN" | base64 --decode > "$CERT_PATH"; then
            echo "::error::MACOS_CERT_P12_BASE64 failed to base64-decode even" \
                 "though every character is in the base64 alphabet — the value is" \
                 "most likely truncated. Re-copy the whole blob."
            exit 1
          fi

          # A .p12 is a DER SEQUENCE, so it always starts with 0x30. Catching a
          # wrong-file paste here beats letting `security import` fail later
          # with a generic error, or — worse — succeed on something unexpected.
          if [ "$(head -c 1 "$CERT_PATH" | xxd -p)" != "30" ]; then
            echo "::error::The decoded MACOS_CERT_P12_BASE64 is not a PKCS#12 file." \
                 "Check you exported a 'Developer ID Application' certificate" \
                 "(with its private key) as .p12 — not a .cer or .pem."
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # -P puts the password on argv, so it is briefly visible in `ps`.
          # Accepted: the runner is ephemeral and single-tenant.
          security import "$CERT_PATH" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          # Without this, codesign triggers an interactive keychain prompt that
          # nothing can answer on a headless runner, and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Put it first in the search list so codesign finds the identity,
          # keeping the runner's existing keychains after it. Read the old list
          # into an array first — doing it inline as an unquoted $(...) means a
          # failure of the inner command silently collapses the search list to
          # just this one keychain for the rest of the job.
          OLD_KEYCHAINS=()
          while IFS= read -r k; do
            k="${k//\"/}"; k="${k#"${k%%[![:space:]]*}"}"; k="${k%"${k##*[![:space:]]}"}"
            [ -n "$k" ] && OLD_KEYCHAINS+=("$k")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${OLD_KEYCHAINS[@]}"

          rm -f "$CERT_PATH"

          echo "Identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          # Same whitespace-tolerant, diagnosable decode as the .p12 step above.
          CLEAN="$(printf '%s' "$APPLE_API_KEY_P8_BASE64" | tr -d '[:space:]')"

          if [ -z "$CLEAN" ]; then
            echo "::error::APPLE_API_KEY_P8_BASE64 is empty. Set it with:" \
                 "base64 -i AuthKey_XXXXXXXXXX.p8 | pbcopy"
            exit 1
          fi

          if printf '%s' "$CLEAN" | LC_ALL=C grep -q '[^A-Za-z0-9+/=]'; then
            echo "::error::APPLE_API_KEY_P8_BASE64 contains characters that are not" \
                 "valid base64. Re-copy it with: base64 -i AuthKey_XXXXXXXXXX.p8 | pbcopy"
            exit 1
          fi

          if ! printf '%s' "$CLEAN" | base64 --decode > "$RUNNER_TEMP/apikey.p8"; then
            echo "::error::APPLE_API_KEY_P8_BASE64 failed to base64-decode; the" \
                 "value is most likely truncated. Re-copy the whole blob."
            exit 1
          fi

          # The .p8 is PEM, so notarytool needs the header intact. A base64 blob
          # of the wrong file decodes fine and only explodes much later, inside
          # notarization, after a full build has already been paid for.
          if ! head -n 1 "$RUNNER_TEMP/apikey.p8" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::The decoded APPLE_API_KEY_P8_BASE64 is not a PEM private" \
                 "key. Check you base64'd the App Store Connect .p8 file itself."
            exit 1
          fi

          chmod 600 "$RUNNER_TEMP/apikey.p8"

      - name: Build, sign, notarize and staple
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/apikey.p8"
          ./Scripts/release.sh

      # Turn the DMG into a Sparkle update. Only meaningful for a tagged release
      # (a manual workflow_dispatch has no tag to version the update with), which
      # mirrors the gating on the version-stamp step above.
      #
      # The appcast is generated against the *whole* gh-pages history — previous
      # DMGs plus the existing appcast.xml — so deltas are emitted against the
      # last release and old entries are pruned rather than orphaned. On the
      # first release there is no gh-pages yet; generate_appcast starts fresh.
      - name: Generate Sparkle appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_ED25519_KEY: ${{ secrets.SPARKLE_ED25519_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SPARKLE_ED25519_KEY" ]; then
            echo "::error::SPARKLE_ED25519_KEY secret is not set. Add the base64" \
                 "EdDSA seed from .sparkle-ed25519-key as a repository secret" \
                 "(Settings → Secrets and variables → Actions)."
            exit 1
          fi

          V="${GITHUB_REF_NAME#v}"
          PAGES="build/pages"
          rm -rf "$PAGES"
          mkdir -p "$PAGES"

          # Bring in whatever gh-pages already holds (previous DMGs, appcast.xml,
          # delta files, old_updates/) so the feed stays contiguous.
          if git fetch origin gh-pages:refs/remotes/origin/gh-pages 2>/dev/null; then
            git archive refs/remotes/origin/gh-pages | tar -x -C "$PAGES"
          fi

          cp build/Jumbini.dmg "$PAGES/Jumbini-$V.dmg"
          SPARKLE_ED25519_KEY="$SPARKLE_ED25519_KEY" ./Scripts/appcast.sh "$PAGES"

      - name: Deploy appcast to GitHub Pages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/pages
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "Publish appcast for ${{ github.ref_name }}"

      # Always runs, including after a failed build, so the key never survives
      # the job even if something above blew up.
      - name: Clean up secrets
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/apikey.p8" "$RUNNER_TEMP/cert.p12"
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi

      - name: Attach DMG to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Jumbini.dmg
          draft: true          # review it before it goes public
          generate_release_notes: true
