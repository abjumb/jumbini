name: CI

# Jumbini is macOS-only — AppKit and SpriteKit throughout — so there is no
# useful build to run anywhere else. This exists because the package went a
# long stretch with no CI at all, which meant nothing caught a compile error
# until someone happened to build on a Mac.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      snapshot:
        description: >-
          Print the panel renders as base64 so they can be decoded and
          looked at. Off by default — a few hundred lines of noise.
        type: boolean
        default: false

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # `macos-latest` rather than a pinned image: the package only needs
    # macOS 14+ to build for, and nothing here is sensitive to which host
    # version compiles it, so tracking GitHub's default avoids the workflow
    # rotting when an image is retired.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      # Printed unconditionally: when a build breaks after a runner image
      # rolls forward, the toolchain version is the first thing worth seeing.
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      # Deliberately `swift test` and not `Scripts/test.sh`. That script
      # exists for developers on Command Line Tools *without* Xcode, where
      # Swift Testing needs an explicit macro plugin path and two rpaths into
      # /Library/Developer/CommandLineTools. Runners have full Xcode, where
      # those flags are unnecessary and point at a toolchain that isn't the
      # one compiling. Contributors should keep using the script locally.
      - name: Test
        env:
          # The panels are the one part of Jumbini whose correctness is "does it
          # look right", and this is how a picture of them gets off the runner
          # and in front of someone. It is an input rather than a line someone
          # edits in for a render and takes back out afterwards, because twice
          # now the taking-out half was the part that got forgotten and the flag
          # rode a merge onto main.
          JUMBINI_SNAPSHOT: ${{ inputs.snapshot && '1' || '0' }}
        run: swift test

      # The ship path: a release build, the .app assembled around it, the
      # SwiftPM resource bundle copied in. Catches breakage that a debug
      # build and the test suite both miss — a resource declaration that
      # doesn't survive `-c release`, or an Info.plist that stops matching.
      - name: Bundle the app
        run: ./Scripts/bundle.sh

      # Assembling the .app says it can be built, not that it starts. Six
      # releases shipped crashing a second into launch because every check
      # stopped at "the bundle exists" -- see the header of smoke.sh. This
      # runs the binary and fails if it is not still alive a few seconds later.
      - name: Smoke test the bundled app
        run: ./Scripts/smoke.sh
